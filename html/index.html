<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════════════════════════════════
     WBO2 NANO
══════════════════════════════════════ -->
<div id="wbo2-nano">
  <div class="wbo2-bezel">
    <div class="wbo2-brand">FuelTech</div>
    <div class="wbo2-screen">
      <span class="wbo2-val" id="wbo2Val">14.70</span>
    </div>
    <div class="wbo2-footer">WBØ2 NANO</div>
  </div>
</div>

<!-- ══════════════════════════════════════
     FT700 PLUS — HUD principal
══════════════════════════════════════ -->
<div id="speedometer">
  <div class="ft-root">

    <!-- ── LED Strip ─────────────────────────────── -->
    <div class="led-strip" id="ledStrip">
      <div class="led" id="led0"></div>
      <div class="led" id="led1"></div>
      <div class="led" id="led2"></div>
      <div class="led" id="led3"></div>
      <div class="led" id="led4"></div>
      <div class="led" id="led5"></div>
      <div class="led" id="led6"></div>
      <div class="led" id="led7"></div>
      <div class="led" id="led8"></div>
      <div class="led" id="led9"></div>
      <div class="led" id="led10"></div>
      <div class="led" id="led11"></div>
    </div>

    <!-- ── Main Dashboard ────────────────────────── -->
    <div class="ft-dash">

      <!-- LEFT: Engine indicator + Gear/RPM gauge -->
      <div class="ft-left">
        <div class="ft-engine-btn">
          <div class="ft-engine-ring" id="ftEngineDot"></div>
          <span class="ft-engine-lbl">START<br>Engine</span>
        </div>
        <div class="ft-gear-wrap">
          <canvas id="gearCanvas" width="88" height="88"></canvas>
        </div>
      </div>

      <!-- CENTER-LEFT: Data block -->
      <div class="ft-data">
        <div class="ft-dline">
          <span class="ft-dlbl">T. Motor</span>
          <span class="ft-dval" id="tMotor">20.0</span>
        </div>
        <div class="ft-dline">
          <span class="ft-dlbl">P. Óleo</span>
          <span class="ft-dval" id="pOleo">0.00</span>
        </div>
        <div class="ft-dline">
          <span class="ft-dlbl">Possível Dist.</span>
          <span class="ft-dval" id="dataThrottle">0%</span>
        </div>
        <div class="ft-dline">
          <span class="ft-dlbl">P. Comb.</span>
          <span class="ft-dval" id="pComb">0.00</span>
        </div>
        <div class="ft-dline">
          <span class="ft-dlbl">Motor</span>
          <span class="ft-dval" id="motorHealth">100%</span>
        </div>
      </div>

      <!-- CENTER: Main speedometer -->
      <div class="ft-speedo">
        <div class="ft-speedo-wrap">
          <canvas id="speedCanvas" width="168" height="168"></canvas>
          <div class="ft-speed-overlay">
            <div class="ft-speed-num" id="speed">0</div>
            <div class="ft-speed-unit">km/h</div>
          </div>
        </div>
      </div>

      <!-- RIGHT: Side data + fuel bar -->
      <div class="ft-right">
        <div class="ft-rdata">
          <div class="ft-dline">
            <span class="ft-dlbl">T. Ar</span>
            <span class="ft-dval" id="tAr">25.0</span>
          </div>
          <div class="ft-dline">
            <span class="ft-dlbl">Lambda</span>
            <span class="ft-dval ft-dval-lam" id="sGeral">1.00</span>
          </div>
          <div class="ft-dline">
            <span class="ft-dlbl">Trip</span>
            <span class="ft-dval" id="odoTrip">0.0</span>
          </div>
        </div>
        <div class="ft-fuelbar-outer">
          <div class="ft-fuelbar-track">
            <div class="ft-fuelbar-fill" id="tanqueFill"></div>
          </div>
          <span class="ft-fuelbar-lbl">E</span>
          <span class="ft-fuelbar-lbl ft-fuelbar-f">F</span>
        </div>
      </div>

    </div>

    <!-- ── Bottom bar ────────────────────────────── -->
    <div class="ft-bottom">
      <span class="ftb-odo" id="odoTotal">00000.0</span>
      <span class="ftb-model">FT700 PLUS</span>
      <div class="ftb-lam-wrap">
        <span class="ftb-lam-val" id="ftLamBottom">1.00</span>
        <span class="ftb-lam-sym">λ</span>
      </div>
      <span class="ftb-logo">FuelTech</span>
      <span id="bankBadge" class="ft-bank bank-A">A</span>
    </div>

    <!-- Alert -->
    <div class="alert-bar" id="alertBar"></div>

    <!-- ── Hidden IDs required by script.js ─────── -->
    <canvas id="rpmCanvas"  width="160" height="160" class="hud-hidden"></canvas>
    <canvas id="lambdaGauge" width="10" height="10"  class="hud-hidden"></canvas>
    <canvas id="gaugeFuel"  width="10"  height="10"  class="hud-hidden"></canvas>
    <canvas id="gaugeRpm"   width="10"  height="10"  class="hud-hidden"></canvas>
    <canvas id="gaugeTemp"  width="10"  height="10"  class="hud-hidden"></canvas>
    <canvas id="gaugeOil"   width="10"  height="10"  class="hud-hidden"></canvas>
    <span id="gear"         class="hud-hidden">N</span>
    <span id="rpmVal"       class="hud-hidden">0</span>

  </div>
</div>

<!-- ══════════════════════════════════════
     ECU POPUP
══════════════════════════════════════ -->
<div id="ecu-menu">
  <div class="ft700-device">
    <div class="ft700-hdr">
      <div class="ft700-led-strip" id="menuLedStrip">
        <div class="mled" id="ml0"></div><div class="mled" id="ml1"></div>
        <div class="mled" id="ml2"></div><div class="mled" id="ml3"></div>
        <div class="mled" id="ml4"></div><div class="mled" id="ml5"></div>
        <div class="mled" id="ml6"></div><div class="mled" id="ml7"></div>
        <div class="mled" id="ml8"></div><div class="mled" id="ml9"></div>
        <div class="mled" id="ml10"></div><div class="mled" id="ml11"></div>
      </div>
      <div class="ft700-brand">
        <span class="ft700-name">FuelTech</span>
        <span class="ft700-model-lbl">FT700</span>
      </div>
    </div>
    <div class="ft700-mid">
      <div class="ft700-side-leds">
        <div class="sled" id="sl0"></div><div class="sled" id="sl1"></div>
        <div class="sled" id="sl2"></div><div class="sled" id="sl3"></div>
      </div>
      <div class="ft700-lcd" id="lcdContent"><!-- populated by JS --></div>
      <div class="ft700-side-leds">
        <div class="sled" id="sr0"></div><div class="sled" id="sr1"></div>
        <div class="sled" id="sr2"></div><div class="sled" id="sr3"></div>
      </div>
    </div>
    <div class="ft700-ctrl">
      <button class="ft700-btn btn-back" id="btnBack">✗</button>
      <button class="ft700-btn btn-menu" id="btnMenu">≡ MENU</button>
      <button class="ft700-btn btn-ok"   id="btnOk">✓</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     MANUAL TRANSMISSION badge
══════════════════════════════════════ -->
<div id="mt-badge" style="display:none;">
  <div class="mt-label">MANUAL</div>
  <div class="mt-gear" id="mtGear">1</div>
  <div class="mt-arrows">
    <span class="mt-up" id="mtUp">▲</span>
    <span class="mt-dn" id="mtDn">▼</span>
  </div>
</div>

<!-- ══════════════════════════════════════
     DRAG / ET SLIP overlay
══════════════════════════════════════ -->
<div id="drag-slip" style="display:none;">
  <div class="slip-inner">
    <div class="slip-title">⏱ ET SLIP — 1/4 MILHA</div>
    <div class="slip-row">
      <span class="slip-lbl">60 km/h</span>
      <span class="slip-val" id="slip60">---</span>
    </div>
    <div class="slip-row">
      <span class="slip-lbl">100 km/h</span>
      <span class="slip-val" id="slip100">---</span>
    </div>
    <div class="slip-row">
      <span class="slip-lbl">402 m (1/4)</span>
      <span class="slip-val" id="slip402">---</span>
    </div>
    <div class="slip-row slip-row-trap">
      <span class="slip-lbl">TRAP</span>
      <span class="slip-val slip-trap" id="slipSpd">---</span>
    </div>
  </div>
</div>

<script src="script.js?v=9"></script>
</body>
</html>
