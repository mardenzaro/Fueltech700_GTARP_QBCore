<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════════════════════════════════
     WBO2 NANO (acima do speedometer)
══════════════════════════════════════ -->
<div id="wbo2-nano">
  <div class="wbo2-bezel">
    <div class="wbo2-brand">FuelTech</div>
    <div class="wbo2-screen">
      <span class="wbo2-val" id="wbo2Val">14.70</span>
    </div>
    <div class="wbo2-footer">WBØ2 NANO</div>
  </div>
</div>

<!-- ══════════════════════════════════════
     SPEEDOMETER HUD (bottom-right)
══════════════════════════════════════ -->
<div id="speedometer">
  <div class="hud-root">

    <!-- ── LED Shift Strip (full width) ───────── -->
    <div class="led-strip" id="ledStrip">
      <div class="led" id="led0"></div>
      <div class="led" id="led1"></div>
      <div class="led" id="led2"></div>
      <div class="led" id="led3"></div>
      <div class="led" id="led4"></div>
      <div class="led" id="led5"></div>
      <div class="led" id="led6"></div>
      <div class="led" id="led7"></div>
      <div class="led" id="led8"></div>
      <div class="led" id="led9"></div>
      <div class="led" id="led10"></div>
      <div class="led" id="led11"></div>
    </div>

    <div class="hud-body">

      <!-- ════════════════════════════
           LEFT: Analog cluster panel
      ════════════════════════════ -->
      <div class="cluster-panel">

        <!-- 4 mini needle gauges -->
        <div class="gauges-row">

          <div class="mini-gwrap">
            <canvas id="gaugeFuel" width="54" height="42" class="mini-canvas"></canvas>
            <div class="mini-glabels">
              <span>E</span><span class="mini-gtitle">COMB</span><span>F</span>
            </div>
          </div>

          <div class="mini-gwrap">
            <canvas id="gaugeRpm" width="54" height="42" class="mini-canvas"></canvas>
            <div class="mini-glabels">
              <span>0</span><span class="mini-gtitle">RPM</span><span>9k</span>
            </div>
          </div>

          <div class="mini-gwrap">
            <canvas id="gaugeTemp" width="54" height="42" class="mini-canvas"></canvas>
            <div class="mini-glabels">
              <span>C</span><span class="mini-gtitle">T.MOT</span><span>H</span>
            </div>
          </div>

          <div class="mini-gwrap">
            <canvas id="gaugeOil" width="54" height="42" class="mini-canvas"></canvas>
            <div class="mini-glabels">
              <span>0</span><span class="mini-gtitle">P.OLE</span><span>10</span>
            </div>
          </div>

        </div>

        <!-- Gear indicator (pequeno, canto esquerdo) -->
        <div class="cluster-gear-row">
          <span class="cluster-manual-txt" id="clManualTxt">MANUAL</span>
          <div class="cluster-gear-box">
            <span class="cluster-gear" id="gear">N</span>
          </div>
        </div>

        <!-- Velocidade dominante -->
        <div class="cluster-speed-row">
          <span class="cluster-spd" id="speed">0</span>
          <span class="cluster-spd-unit">KM/H</span>
        </div>

        <!-- Bottom: green C dot + odometer -->
        <div class="cluster-bot">
          <div class="c-circle">C</div>
          <div class="cluster-odo" id="odoTotal">00000.0</div>
        </div>

        <!-- Hidden preserved IDs required by script.js -->
        <canvas id="rpmCanvas" width="160" height="160" class="hud-hidden-canvas"></canvas>
        <span id="rpmVal"      class="hud-hidden-val">0</span>
        <span id="tMotor"      class="hud-hidden-val">20.0</span>
        <span id="tAr"         class="hud-hidden-val">25.0</span>
        <span id="motorHealth" class="hud-hidden-val">100%</span>
        <span id="odoTrip"     class="hud-hidden-val">0.0</span>
        <div class="hud-hidden-val"><div id="tanqueFill"></div></div>

      </div>

      <!-- ════════════════════════════
           RIGHT: FT700 physical device
      ════════════════════════════ -->
      <div class="ft-device">

        <!-- Device header -->
        <div class="ftd-hdr">
          <span class="ftd-brand">FuelTech</span>
          <span id="bankBadge" class="ft-bank bank-A">A</span>
        </div>

        <!-- Lambda circular gauge screen (value drawn on canvas) -->
        <div class="ftd-screen">
          <canvas id="lambdaGauge" width="106" height="106"></canvas>
          <span id="sGeral" class="hud-hidden-val">1.00</span>
        </div>

        <!-- Efficiency row -->
        <div class="ftd-eff">
          <span class="ftd-eff-val">0</span>
          <span class="ftd-eff-unit">km/g</span>
        </div>

        <!-- Bottom 3-cell data bar -->
        <div class="ftd-cells">
          <div class="ftd-cell">
            <div class="ftd-clbl">% Inj</div>
            <div class="ftd-cval" id="dataThrottle">0</div>
          </div>
          <div class="ftd-cell">
            <div class="ftd-clbl">P Comb</div>
            <div class="ftd-cval" id="pComb">0.00</div>
          </div>
          <div class="ftd-cell">
            <div class="ftd-clbl">P Óleo</div>
            <div class="ftd-cval" id="pOleo">0.00</div>
          </div>
        </div>

        <!-- Model footer -->
        <div class="ftd-footer">FT700</div>

      </div>

    </div>

    <!-- Alert ticker (full width) -->
    <div class="alert-bar" id="alertBar"></div>

  </div>
</div>

<!-- ══════════════════════════════════════
     ECU POPUP — /ft command (FT700 device)
══════════════════════════════════════ -->
<div id="ecu-menu">
  <div class="ft700-device">

    <!-- Device header -->
    <div class="ft700-hdr">
      <div class="ft700-led-strip" id="menuLedStrip">
        <div class="mled" id="ml0"></div><div class="mled" id="ml1"></div>
        <div class="mled" id="ml2"></div><div class="mled" id="ml3"></div>
        <div class="mled" id="ml4"></div><div class="mled" id="ml5"></div>
        <div class="mled" id="ml6"></div><div class="mled" id="ml7"></div>
        <div class="mled" id="ml8"></div><div class="mled" id="ml9"></div>
        <div class="mled" id="ml10"></div><div class="mled" id="ml11"></div>
      </div>
      <div class="ft700-brand">
        <span class="ft700-name">FuelTech</span>
        <span class="ft700-model-lbl">FT700</span>
      </div>
    </div>

    <!-- Mid area: side LEDs + LCD + side LEDs -->
    <div class="ft700-mid">

      <!-- 4 alert LEDs — left side -->
      <div class="ft700-side-leds">
        <div class="sled" id="sl0"></div>
        <div class="sled" id="sl1"></div>
        <div class="sled" id="sl2"></div>
        <div class="sled" id="sl3"></div>
      </div>

      <!-- LCD content area -->
      <div class="ft700-lcd" id="lcdContent">
        <!-- populated by JS -->
      </div>

      <!-- 4 alert LEDs — right side -->
      <div class="ft700-side-leds">
        <div class="sled" id="sr0"></div>
        <div class="sled" id="sr1"></div>
        <div class="sled" id="sr2"></div>
        <div class="sled" id="sr3"></div>
      </div>

    </div>

    <!-- Control buttons row -->
    <div class="ft700-ctrl">
      <button class="ft700-btn btn-back"  id="btnBack">✗</button>
      <button class="ft700-btn btn-menu"  id="btnMenu">≡ MENU</button>
      <button class="ft700-btn btn-ok"    id="btnOk">✓</button>
    </div>

  </div>
</div>

<!-- ══════════════════════════════════════
     MANUAL TRANSMISSION badge
══════════════════════════════════════ -->
<div id="mt-badge" style="display:none;">
  <div class="mt-label">MANUAL</div>
  <div class="mt-gear" id="mtGear">1</div>
  <div class="mt-arrows">
    <span class="mt-up" id="mtUp">▲</span>
    <span class="mt-dn" id="mtDn">▼</span>
  </div>
</div>

<!-- ══════════════════════════════════════
     DRAG / ET SLIP overlay (auto-hide 12s)
══════════════════════════════════════ -->
<div id="drag-slip" style="display:none;">
  <div class="slip-inner">
    <div class="slip-title">⏱ ET SLIP — 1/4 MILHA</div>
    <div class="slip-row">
      <span class="slip-lbl">60 km/h</span>
      <span class="slip-val" id="slip60">---</span>
    </div>
    <div class="slip-row">
      <span class="slip-lbl">100 km/h</span>
      <span class="slip-val" id="slip100">---</span>
    </div>
    <div class="slip-row">
      <span class="slip-lbl">402 m (1/4)</span>
      <span class="slip-val" id="slip402">---</span>
    </div>
    <div class="slip-row slip-row-trap">
      <span class="slip-lbl">TRAP</span>
      <span class="slip-val slip-trap" id="slipSpd">---</span>
    </div>
  </div>
</div>

<script src="script.js?v=8"></script>
</body>
</html>
